# ===================================================================
#  SITE SETTINGS  -  edit the values on the right of each colon
# ===================================================================
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# ---- who you are ----
title: Your Name
subtitle: 'AI-ready <span class="accent">Analytics Engineering</span>'
description: "I turn messy, scattered data into clean models and trusted metrics, so dashboards, decisions and AI tools all give answers you can rely on. See what I have delivered below, or get in touch."
availability: "Open to analytics and AI-data projects, and full-time roles"
location: "Your City, Country"
avatar_image: /img/profile_picture.JPG
resume_url: /docs/resume.docx

# the hero line types out: "<roles_prefix> <one of the roles>"
roles_prefix: "I turn messy data into"
roles:
  - trusted metrics
  - clean, tested data models
  - AI-ready data for assistants and agents
  - dashboards leaders use
  - decisions that stick
  - Machine Learning models that are explainable
  - AI systems are producing reliable outputs grounded in source data

# ---- contact and social links ----
email: gechembama@gmail.com
github: "https://github.com/machaniG"
linkedin: "https://linkedin.com/in/fmachani"
linkedln: "https://linkedin.com/in/fmachani"   # same link again (the footer uses this spelling)
# optional: contact form. Make a free form at formspree.io and paste its id here (e.g. abcdwxyz). Leave empty for email-only.
formspree: ""

# ---- web address (needed for the sitemap) ----
baseurl: ""
url: ""            # e.g. "https://machanig.github.io"

# ---- build settings (leave as is) ----
markdown: kramdown
permalink: /projects/:title/

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: false
      share: false
