# AI-READY: the "good data makes AI work" section. Each point has a topic, what goes wrong without it, and what I do about it.
title: AI is only as good as the data behind it
lead: Everyone wants to use AI. Assistants, agents and copilots all read your data, so messy data turns into confident wrong answers. This is what I fix first.
points:
  - topic: One definition per metric
    without: Ask an AI assistant for revenue and it picks one of five definitions, then answers with total confidence.
    fix: One written definition per metric, so every answer matches the finance report.
  - topic: Documented tables and columns
    without: Columns called col_7 and flag_2 leave the AI guessing what they mean.
    fix: Plain-English descriptions on every table and column, which AI tools read to query correctly.
  - topic: Tested, fresh data
    without: Duplicates, stale loads and broken joins quietly turn into wrong answers.
    fix: Automated tests and freshness checks catch bad data before a person or an AI sees it.
  - topic: Clean knowledge bases
    without: A document assistant finds outdated and duplicate files and quotes both.
    fix: Documents deduplicated, dated and tagged, so the assistant retrieves the current version.
  - topic: Measured accuracy
    without: Nobody knows whether the AI is right, so trust depends on gut feeling.
    fix: A test set of real business questions with known answers, so accuracy is measured and drops are caught.
  - topic: Privacy and access
    without: An assistant can surface salaries or customer details to people who should not see them.
    fix: Sensitive fields masked and access rules enforced, so each person and AI only sees what they are allowed to.
