# WAYS TO WORK TOGETHER: one block per engagement. Copy a block to add another.
- title: Analytics and AI-readiness audit
  blurb: Find out where your numbers disagree and which data is safe to put in front of AI.
  gets:
    - Inventory of your sources, reports and metric definitions
    - List of conflicting numbers and data quality issues
    - AI-readiness score for each data source, with a prioritised roadmap
  time: 1 to 2 weeks
  repo: ""

- title: Data modeling and transformation
  blurb: Raw tables turned into clean, tested models your whole team can query.
  gets:
    - Staging, intermediate and mart layers in dbt
    - Tests and documentation on every model
    - CI checks so changes do not break reports
  time: 4 to 8 weeks
  repo: https://github.com/machaniG/your-dbt-example

- title: AI-ready data layer
  blurb: Make your data understandable to AI assistants and agents, and prove they answer correctly.
  gets:
    - Semantic layer with metric definitions and column descriptions
    - Test set of real business questions with known answers
    - Masking and access rules for sensitive fields
  time: 4 to 8 weeks
  repo: ""

- title: Metrics layer and dashboards
  blurb: One definition per metric, and dashboards built around real decisions.
  gets:
    - Agreed KPI definitions with owners
    - A metrics layer your BI tool reads from
    - Focused dashboards with a clear question each
  time: 3 to 6 weeks
  repo: ""

- title: Data quality and observability
  blurb: Know when data breaks before your stakeholders, or your AI tools, do.
  gets:
    - Freshness, volume and accuracy tests
    - Data contracts between teams
    - Alerts to the right people and runbooks for common failures
  time: 2 to 4 weeks
  repo: ""

- title: Analytics partner (monthly)
  blurb: Ongoing help with new questions, fixes and a tidy backlog.
  gets:
    - A fixed number of days each month
    - Priority on the questions that matter most
    - Regular written updates
  time: Monthly, cancel any time
  repo: ""
