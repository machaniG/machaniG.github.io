# HOW I WORK: the four steps shown under Services.
- title: Map the mess
  text: Free 30-minute call, then a short audit of your sources, reports and conflicting numbers.
- title: Agree the decisions
  text: We list the decisions and AI use cases the data must support, then define each metric once, in writing.
- title: Build and test
  text: Models, tests, documentation and dashboards built on your real data, with a demo every week.
- title: Hand over
  text: Documented, monitored and measured, so your team can run it without me.
